name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  arduino:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn:
          - arduino:avr:leonardo
          - arduino:avr:mega
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          sketch-paths: |
            - firmware/Shared_Socket_Cooker_Timer
          enable-warnings-report: true
